# 깃허브 페이지 자동 배포
#
# main 브랜치에 푸시할 때마다 깃허브가
#   npm ci → npm run build
# 를 돌리고, 나온 dist/ 를 Pages 에 올린다.
# 그래서 저장소에 dist/ 를 커밋하지 않아도 된다.
# (dist/index.html 한 파일 + dist/설치안내.html 교사용 안내문이 함께 올라간다)
#
# ⚠️ 처음 한 번만 손으로 해야 할 수도 있는 일
#   저장소 Settings → Pages → Build and deployment → Source 를 「GitHub Actions」 로 바꾼다.
#   아래 configure-pages 의 enablement 로 자동으로 켜 보지만,
#   저장소에 따라 워크플로 토큰에 Pages 생성 권한이 없어 거부되기도 한다.
#   (그래서 continue-on-error 로 두어, 안 되더라도 빌드가 멈추지 않게 했다.)
#
# ❌ 절대 하면 안 되는 것 — Source 를 「Deploy from a branch」 로 고르기.
#   우리는 dist/ 를 커밋하지 않으므로, 브랜치 배포를 고르면 깃허브가 빌드하지 않은
#   개발용 index.html 을 그대로 올려서 흰 화면만 뜬다.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 저장소 Actions 탭에서 손으로 실행할 수도 있다

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 살린다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        run: npm run build

      # 빌드 결과가 제대로 나왔는지 최소한만 확인한다.
      # (dist/index.html 과 교사용 안내문이 둘 다 있어야 하고, 앱이 통째로 들어간
      #  한 파일이라 크기가 200KB 는 넘어야 정상이다)
      - name: 빌드 결과 점검
        run: |
          test -f dist/index.html || { echo "dist/index.html 이 없습니다"; exit 1; }
          test -f "dist/설치안내.html" || { echo "교사용 안내문이 복사되지 않았습니다"; exit 1; }
          size=$(stat -c%s dist/index.html)
          echo "dist/index.html = ${size} 바이트"
          [ "$size" -gt 200000 ] || { echo "빌드 결과가 너무 작습니다 — 인라인이 안 된 것 같습니다"; exit 1; }
          # 저작권 표시가 압축에 지워지지 않았는지 확인한다.
          # 세 군데(HTML 주석·스크립트 배너·화면 푸터)에 남아야 정상이다.
          hits=$(grep -c 티쳐무 dist/index.html || true)
          echo "저작권 표시 «티쳐무» ${hits}줄에서 발견"
          [ "$hits" -ge 1 ] || { echo "저작권 표시가 사라졌습니다 — vite.config.js 의 banner 와 legalComments 를 확인하세요"; exit 1; }

      # Pages 가 꺼져 있으면 켜 본다. 권한이 없어 실패해도 배포를 멈추지는 않는다.
      - name: Pages 설정 확인
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
